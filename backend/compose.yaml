services:
  postgres:
    image: postgres:16-alpine
    container_name: farmverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-farmverse_db}
      POSTGRES_USER: ${DB_USERNAME:-farmverse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env before starting PostgreSQL}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-farmverse_user} -d ${DB_NAME:-farmverse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
